[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rop-insight"
version = "0.1.0"
description = "Local fundus image viewer"
requires-python = ">=3.12"
dependencies = ["PyQt6==6.10.2"]

[project.gui-scripts]
rop-insight = "rop_insight.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyqt6"
